<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Advance School of Business — Course Reference</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Roboto', sans-serif; background: #F6F6F4; color: #2D2D2D; font-size: 14px; }

header { background: #2D2D2D; }
.header-top { display: flex; align-items: center; justify-content: space-between; padding: 16px 32px; border-bottom: 3px solid #7A1219; }
.header-logo { color: white; font-size: 28px; font-weight: 700; letter-spacing: -0.5px; font-style: italic; }
.header-logo span { font-weight: 400; }
.header-sub { color: #9B9B99; font-size: 12px; margin-top: 3px; }

nav { display: flex; background: #1a1a1a; padding: 0 32px; }
nav button { background: none; border: none; color: #9B9B99; font-size: 14px; font-family: inherit; font-weight: 500; padding: 14px 20px; cursor: pointer; border-bottom: 3px solid transparent; }
nav button:hover { color: white; }
nav button.active { color: white; border-bottom-color: #7A1219; }

.page { display: none; padding: 28px 32px; max-width: 1100px; margin: 0 auto; }
.page.active { display: block; }

.course-hero { background: #2D2D2D; color: white; border-radius: 8px; padding: 24px 28px; margin-bottom: 24px; display: flex; justify-content: space-between; align-items: flex-start; gap: 20px; }
.course-hero h1 { font-size: 20px; font-weight: 700; margin-bottom: 6px; }
.course-hero p { font-size: 13px; color: #B0AFA8; line-height: 1.6; }
.course-meta { text-align: right; flex-shrink: 0; }
.badge { background: #7A1219; color: white; font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 4px; display: inline-block; margin-bottom: 6px; }
.course-meta p { font-size: 12px; color: #9B9B99; }

.week-tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 20px; }
.week-tab { background: white; border: 1px solid #E8E8E8; border-radius: 6px; padding: 7px 14px; font-size: 13px; font-weight: 500; cursor: pointer; color: #5F5E5A; font-family: inherit; }
.week-tab:hover { border-color: #7A1219; color: #7A1219; }
.week-tab.active { background: #7A1219; border-color: #7A1219; color: white; }

.week-content { display: none; }
.week-content.active { display: block; }
.week-title { font-size: 17px; font-weight: 700; margin-bottom: 18px; color: #2D2D2D; }

.card { background: white; border: 1px solid #E8E8E8; border-radius: 8px; margin-bottom: 12px; overflow: hidden; }
.card-header { padding: 14px 18px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; user-select: none; }
.card-header:hover { background: #F6F6F4; }
.card-title { font-size: 14px; font-weight: 700; }
.card-right { display: flex; align-items: center; gap: 10px; }
.tag { font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 3px; text-transform: uppercase; letter-spacing: 0.4px; }
.tag-out { background: #E8E8E8; color: #5F5E5A; }
.tag-read { background: #FBEAEA; color: #7A1219; }
.tag-disc { background: #E1F5EE; color: #0F6E56; }
.tag-asgn { background: #E6F1FB; color: #185FA5; }
.tag-pod { background: #F0E8F8; color: #6B2FA0; }
.chev { font-size: 11px; color: #9B9B99; transition: transform 0.18s; }
.chev.open { transform: rotate(180deg); }

.card-body { display: none; padding: 0 18px 18px; border-top: 1px solid #F0F0F0; }
.card-body.open { display: block; }

/* Outcomes */
.out-list { list-style: none; padding: 14px 0 0; }
.out-list li { padding: 5px 0; line-height: 1.6; border-bottom: 1px solid #F6F6F4; display: flex; align-items: flex-start; gap: 8px; }
.out-list li:last-child { border-bottom: none; }
.out-list li::before { content: ""; display: block; width: 6px; height: 6px; border-radius: 50%; background: #7A1219; margin-top: 7px; flex-shrink: 0; }
.out-code { font-size: 11px; color: #7A1219; font-weight: 700; white-space: nowrap; }

/* Readings */
.read-list { padding: 14px 0 0; }
.read-item { display: flex; align-items: flex-start; gap: 10px; padding: 8px 0; border-bottom: 1px solid #F6F6F4; }
.read-item:last-child { border-bottom: none; }
.read-badge { font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 3px; white-space: nowrap; flex-shrink: 0; margin-top: 1px; }
.rb-ch { background: #E8E8E8; color: #5F5E5A; }
.rb-vid { background: #FBEAEA; color: #7A1219; }
.read-item a { color: #185FA5; text-decoration: none; line-height: 1.5; }
.read-item a:hover { text-decoration: underline; }

/* Discussion */
.disc-list { padding: 14px 0 0; counter-reset: dq; }
.disc-item { counter-increment: dq; display: flex; gap: 10px; padding: 7px 0; border-bottom: 1px solid #F6F6F4; line-height: 1.6; }
.disc-item:last-child { border-bottom: none; }
.disc-item::before { content: counter(dq); font-weight: 700; color: #7A1219; min-width: 18px; flex-shrink: 0; }

/* Assignment */
.asgn-block { padding: 14px 0 0; }
.asgn-meta { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
.meta-pill { background: #F6F6F4; border: 1px solid #E8E8E8; border-radius: 4px; padding: 3px 10px; font-size: 12px; }
.meta-pill strong { color: #7A1219; }
.asgn-overview { line-height: 1.7; margin-bottom: 14px; color: #2D2D2D; }
.note-box { background: #F6F6F4; border-left: 3px solid #7A1219; padding: 8px 12px; font-size: 13px; line-height: 1.6; margin: 10px 0; color: #5F5E5A; }
.sub-head { font-size: 12px; font-weight: 700; color: #7A1219; text-transform: uppercase; letter-spacing: 0.5px; margin: 14px 0 8px; }
.inst-list { counter-reset: inst; }
.inst-list li { counter-increment: inst; display: flex; gap: 10px; padding: 7px 0; border-bottom: 1px solid #F6F6F4; line-height: 1.6; list-style: none; }
.inst-list li:last-child { border-bottom: none; }
.inst-list li::before { content: counter(inst); background: #7A1219; color: white; border-radius: 50%; width: 18px; height: 18px; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; flex-shrink: 0; margin-top: 2px; }

/* Rubric */
.rubric-wrap { overflow-x: auto; margin-top: 10px; }
.rubric { width: 100%; border-collapse: collapse; font-size: 12px; min-width: 500px; }
.rubric th { background: #2D2D2D; color: white; padding: 8px 10px; text-align: left; font-size: 11px; font-weight: 700; white-space: nowrap; }
.rubric td { padding: 7px 10px; border-bottom: 1px solid #F0F0F0; vertical-align: top; line-height: 1.5; }
.rubric tr:nth-child(even) td { background: #FAFAFA; }
.rubric tr:last-child td { border-bottom: none; }
.rubric td:first-child { font-weight: 700; color: #2D2D2D; min-width: 120px; }
.rubric td:nth-child(2) { color: #7A1219; font-weight: 700; min-width: 80px; }
.divider { border-top: 1px solid #E8E8E8; margin: 16px 0; }

@media (max-width: 680px) {
  .page { padding: 16px; }
  .header-top { padding: 12px 16px; }
  nav { padding: 0 16px; }
  .course-hero { flex-direction: column; }
  .course-meta { text-align: left; }
}

/* Deck link button */
.deck-link { display: inline-flex; align-items: center; gap: 8px; background: #2D2D2D; color: white; text-decoration: none; padding: 9px 18px; border-radius: 6px; font-size: 13px; font-weight: 700; margin-bottom: 20px; border: 1px solid #444; }
.deck-link:hover { background: #7A1219; }

/* What You'll Do tab */
.overview-section { margin-bottom: 28px; }
.overview-heading { font-size: 16px; font-weight: 700; color: #2D2D2D; margin-bottom: 16px; padding-bottom: 8px; border-bottom: 2px solid #7A1219; }
.overview-intro { font-size: 14px; color: #5F5E5A; line-height: 1.7; margin-bottom: 20px; }
.week-overview-grid { display: flex; flex-direction: column; gap: 10px; }
.week-ov { display: flex; gap: 14px; align-items: flex-start; background: white; border: 1px solid #E8E8E8; border-radius: 8px; padding: 16px 18px; }
.week-ov-num { width: 36px; height: 36px; border-radius: 50%; background: #7A1219; color: white; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; flex-shrink: 0; }
.week-ov-body { flex: 1; }
.week-ov-title { font-weight: 700; font-size: 13px; color: #2D2D2D; margin-bottom: 4px; }
.week-ov-desc { font-size: 13px; color: #5F5E5A; line-height: 1.6; }
.week-ov-asgn { display: inline-block; margin-top: 6px; font-size: 11px; font-weight: 700; color: #185FA5; background: #E6F1FB; padding: 2px 8px; border-radius: 3px; }

</style>
</head>

      <div class="header-logo"><span>AD</span>VANCE</div>

</header>

<div id="bus300" class="page"></div>
<div id="mgt135" class="page"></div>
<div id="bus410" class="page"></div>

<script>
const IB = 'https://openstax.org/books/introduction-business/pages/';
const MK = 'https://openstax.org/books/principles-marketing/pages/';

// Verified first-section URLs for every chapter — confirmed live in browser
const ibCh = n => IB + n + '-introduction';

  1:  MK+'1-1-marketing-and-the-marketing-process',
  2:  MK+'2-1-developing-a-strategic-plan',
  3:  MK+'3-1-understanding-consumer-markets-and-buying-behavior',
  4:  MK+'4-1-the-business-to-business-b2b-market',
  5:  MK+'5-1-market-segmentation-and-consumer-markets',
  6:  MK+'6-1-marketing-research-and-big-data',
  7:  MK+'7-1-the-global-market-and-advantages-of-international-trade',
  8:  MK+'8-1-strategic-marketing-standardization-versus-adaptation',
  9:  MK+'9-1-products-services-and-experiences',
  10: MK+'10-1-new-products-from-a-customers-perspective',
  11: MK+'11-1-classification-of-services',
  12: MK+'12-1-pricing-and-its-role-in-the-marketing-mix',
  13: MK+'13-1-the-promotion-mix-and-its-elements',
  14: MK+'14-1-advertising-in-the-promotion-mix',
  15: MK+'15-1-personal-selling-and-its-role-in-the-promotion-mix',
  16: MK+'16-1-traditional-direct-marketing',
  17: MK+'17-1-the-use-and-value-of-marketing-channels',
  18: MK+'18-1-retailing-and-the-role-of-retailers-in-the-distribution-channel',
  19: MK+'19-1-sustainable-marketing'

function chLink(url, label) {
  return `<a href="${url}" target="_blank">${label}</a>`;
}



function showCourse(id, btn) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  btn.classList.add('active');
}

function toggle(el) {
  const body = el.nextElementSibling;
  const chev = el.querySelector('.chev');
  body.classList.toggle('open');
  chev.classList.toggle('open');
}

function showWeek(courseId, n) {
  document.querySelectorAll('#'+courseId+' .week-content').forEach(w => w.classList.remove('active'));
  document.querySelectorAll('#'+courseId+' .week-tab').forEach(t => t.classList.remove('active'));
  const wEl = document.getElementById(courseId+'-w'+n);
  const tEl = document.getElementById(courseId+'-t'+n);
  if (wEl) wEl.classList.add('active');
  if (tEl) tEl.classList.add('active');
}

function card(tag, tagClass, title, bodyHtml) {
  return `<div class="card">
    <div class="card-header" onclick="toggle(this)">
      <span class="card-title">${title}</span>
      <span class="card-right"><span class="tag ${tagClass}">${tag}</span><span class="chev">&#9660;</span></span>
    </div>
    <div class="card-body">${bodyHtml}</div>
  </div>`;
}

function outcomes(list) {
  return '<ul class="out-list">'+list.map(o=>`<li><span>${o}</span></li>`).join('')+'</ul>';
}

function readings(list) {
  return '<div class="read-list">'+list.map(r=>`<div class="read-item"><span class="read-badge ${r.vid?'rb-vid':'rb-ch'}">${r.vid?'Watch':'Chapter'}</span><span>${r.link?`<a href="${r.link}" target="_blank">${r.label}</a>`:r.label}</span></div>`).join('')+'</div>';
}

function discussion(list) {
  return '<div class="disc-list">'+list.map(q=>`<div class="disc-item"><span>${q}</span></div>`).join('')+'</div>';
}

function rubric(headers, rows) {
  if(!headers||!headers.length) return '';
  const ths = headers.map(h=>`<th>${h}</th>`).join('');
  const trs = rows.map(r=>'<tr>'+r.map(c=>`<td>${c}</td>`).join('')+'</tr>').join('');
  return `<div class="sub-head">Grading Rubric</div><div class="rubric-wrap"><table class="rubric"><thead><tr>${ths}</tr></thead><tbody>${trs}</tbody></table></div>`;
}

function assignment(a, extra) {
  let inst = a.instructions&&a.instructions.length ? `<div class="sub-head">Instructions</div><ol class="inst-list">${a.instructions.map(i=>`<li><span>${i}</span></li>`).join('')}</ol>` : '';
  let note = a.note ? `<div class="note-box">${a.note}</div>` : '';
  let rub = rubric(a.rh, a.rr);
  let ext = extra||'';
  return `<div class="asgn-block">
    <div class="asgn-meta"><div class="meta-pill"><strong>Points:</strong> ${a.pts}</div><div class="meta-pill"><strong>Length:</strong> ${a.len}</div></div>
    <div class="asgn-overview">${a.overview}</div>
    ${note}${inst}${rub}${ext}
  </div>`;
}

// ── BUS-102 ──────────────────────────────────────────────────────────────────

    ],
    assignment: {

    ],

function podcastCard(courseId, n) {

function buildCourse(courseId, data, heroTitle, heroDesc, credits, weeks, extra6, deckUrl, overviewHtml) {
  const el = document.getElementById(courseId);
  const deckBlock = deckUrl ? `<a class="deck-link" href="${deckUrl}" target="_blank">&#9654; Open Instructor Slide Deck</a>` : '';
  let html = `<div class="course-hero">
    <div><h1>${heroTitle}</h1><p>${heroDesc}</p></div>
    <div class="course-meta"><div class="badge">${credits}</div><p>${weeks} Weeks</p></div>
  </div>
  ${deckBlock}
  <div class="week-tabs" id="${courseId}-tabs"></div>
  <div id="${courseId}-weeks"></div>`;
  el.innerHTML = html;

  const tabsEl = document.getElementById(courseId+'-tabs');
  const weeksEl = document.getElementById(courseId+'-weeks');

  // Overview tab
  if (overviewHtml) {
    const ovTab = document.createElement('button');
    ovTab.className = 'week-tab active';
    ovTab.id = courseId+'-tov';
    ovTab.textContent = 'Course Overview';
    ovTab.onclick = () => showWeek(courseId, 'ov');
    tabsEl.appendChild(ovTab);
    const ovDiv = document.createElement('div');
    ovDiv.className = 'week-content active';
    ovDiv.id = courseId+'-wov';
    ovDiv.innerHTML = overviewHtml;
    weeksEl.appendChild(ovDiv);
  }

  data.forEach((wk, i) => {
    const n = i+1;

    // Tab
    const tab = document.createElement('button');
    tab.className = 'week-tab';
    tab.id = courseId+'-t'+n;
    tab.textContent = 'Week '+n;
    tab.onclick = () => showWeek(courseId, n);
    tabsEl.appendChild(tab);

    // Week container
    const wDiv = document.createElement('div');
    wDiv.className = 'week-content';
    wDiv.id = courseId+'-w'+n;

    // Extra for week 6 BUS-300
    let extraHtml = '';
    if (extra6 && n===6) {
      extraHtml = `<div class="divider"></div>
        ${card('Assignment','tag-asgn', extra6.title, assignment(extra6))}`;
    }

    wDiv.innerHTML = `<div class="week-title">${wk.title}</div>
      ${podcastCard(courseId, n)}
      ${card('Outcomes','tag-out','Learning Outcomes', outcomes(wk.outcomes))}
      ${card('Readings','tag-read','Readings & Videos', readings(wk.readings))}
      ${card('Discussion','tag-disc','Discussion Questions', discussion(wk.discussion))}
      ${card('Assignment','tag-asgn', wk.assignment.title, assignment(wk.assignment))}
      ${extraHtml}`;

    weeksEl.appendChild(wDiv);
  });
}

buildCourse(
  'bus410', bus410,
  'BUS-410: Strategy Implementation (Capstone)',
  'Students synthesize academic knowledge and practical skills to craft a comprehensive strategic plan. Covers market analysis, competitive advantage, financial forecasting, change management, risk mitigation, and KPI frameworks.',
  '3 Credit Hours', 6, null, 'BUS410_Instructor_Deck.html',
  `<div class="overview-section">
  <div class="overview-heading">What You\'ll Do in This Course</div>
  <div class="overview-intro">BUS-410 is the program capstone. From Week 1, you choose a real company (or design a startup) and build a full strategic plan piece by piece. Each week adds a new layer — analysis, strategy, financials, change management, risk, and KPIs. By Week 6 you will have a professional strategic plan and an executive presentation you could deliver to real stakeholders. The required text is Strategic Management (OpenStax), available free online.</div>
  <div class="week-overview-grid">
    <div class="week-ov"><div class="week-ov-num">1</div><div class="week-ov-body"><div class="week-ov-title">Organizational Analysis</div><div class="week-ov-desc">Establish your company\'s foundation: mission, vision, values, and performance metrics. Conduct SWOT, PESTEL, Porter\'s Five Forces, and value chain analysis. Choose the organization you\'ll work with for the entire course.</div><span class="week-ov-asgn">Assignments: Company Overview (8 pts) + Strategic Analysis (12 pts)</span></div></div>
    <div class="week-ov"><div class="week-ov-num">2</div><div class="week-ov-body"><div class="week-ov-title">Strategic Planning and Strategies</div><div class="week-ov-desc">Move from analysis to action. Identify strategic issues, write 4–6 SMART objectives, select business-level and corporate-level strategies, and align tactics with your mission and vision.</div><span class="week-ov-asgn">Assignment: Strategic Objectives, Strategies, and Tactics (20 pts)</span></div></div>
    <div class="week-ov"><div class="week-ov-num">3</div><div class="week-ov-body"><div class="week-ov-title">Financial Analysis</div><div class="week-ov-desc">Ground your strategy in financial reality. Build a multi-year budget and forecast, assess the feasibility of key initiatives, and calculate ROI, NPV, or IRR on proposed investments.</div><span class="week-ov-asgn">Assignment: Financial Analysis and Strategic Forecasting (10 pts)</span></div></div>
    <div class="week-ov"><div class="week-ov-num">4</div><div class="week-ov-body"><div class="week-ov-title">Change Management</div><div class="week-ov-desc">Plan how to lead your organization through the change your strategy requires. Build a stakeholder engagement and communication plan, then assess risks and build a mitigation framework.</div><span class="week-ov-asgn">Assignments: Change Management Plan (14 pts) + Risk Mitigation Plan (6 pts)</span></div></div>
    <div class="week-ov"><div class="week-ov-num">5</div><div class="week-ov-body"><div class="week-ov-title">Measurement and Evaluation</div><div class="week-ov-desc">Define what success looks like. Identify Critical Success Factors, develop SMART KPIs, and build a measurement framework that tracks performance and drives accountability across the organization.</div><span class="week-ov-asgn">Assignment: KPI Selection and Measurement Framework (10 pts)</span></div></div>
    <div class="week-ov"><div class="week-ov-num">6</div><div class="week-ov-body"><div class="week-ov-title">Finalizing and Presenting Your Strategic Plan</div><div class="week-ov-desc">Polish and integrate all prior work into one cohesive strategic plan. Then design and record a 3–5 minute executive presentation summarizing your analysis, strategies, and recommendations.</div><span class="week-ov-asgn">Capstone: Written Strategic Plan (30 pts) + Executive Presentation (20 pts)</span></div></div>
  </div>
</div>`
);

  `<div class="overview-section">

  <div class="week-overview-grid">
    <div class="week-ov"><div class="week-ov-num">1</div><div class="week-ov-body"><div class="week-ov-title">Foundations of Marketing</div><div class="week-ov-desc">Learn what marketing is, how the 4Ps work, how consumer decisions are made, and how marketing connects to business strategy. Choose the company you will use for the entire course — you\'ll build every section of your marketing plan around this company.</div><span class="week-ov-asgn">Assignment 1: Company profile, mission statement, SWOT analysis, and 3 marketing goals with measurable objectives (10 pts)</span></div></div>
    <div class="week-ov"><div class="week-ov-num">2</div><div class="week-ov-body"><div class="week-ov-title">Understanding Your Market</div><div class="week-ov-desc">Dig into B2B vs. B2C markets, learn the STP framework (Segmentation, Targeting, Positioning), build buyer personas, and understand how marketing research and data collection work — including the ethics of consumer data.</div><span class="week-ov-asgn">Assignment 2: Market segmentation, target market definition, 2-3 buyer personas, and positioning map (20 pts)</span></div></div>
    <div class="week-ov"><div class="week-ov-num">3</div><div class="week-ov-body"><div class="week-ov-title">Global & Diversity Marketing</div><div class="week-ov-desc">Explore how companies enter global markets and adapt their strategies to different cultures and legal environments. Examine diversity marketing — what makes it authentic vs. performative — and how U.S. demographic shifts affect marketing strategy.</div><span class="week-ov-asgn">Assignment 3: Current market situation — market size, product review, competitive analysis, comparison to competitors (15 pts)</span></div></div>
    <div class="week-ov"><div class="week-ov-num">4</div><div class="week-ov-body"><div class="week-ov-title">Product Strategy & Pricing</div><div class="week-ov-desc">Learn how products are classified, how the product lifecycle shapes strategy, and how to market services. Master pricing strategy — from cost-based to value-based to psychological pricing — and understand where the ethical lines are.</div><span class="week-ov-asgn">Assignment 3B: Pricing strategy and promotion strategy for your company (15 pts)</span></div></div>
    <div class="week-ov"><div class="week-ov-num">5</div><div class="week-ov-body"><div class="week-ov-title">Promotion & Distribution</div><div class="week-ov-desc">Study the full promotion mix: IMC, advertising, PR, personal selling, sales promotions, digital and social media marketing, and mobile marketing. Learn how distribution channels connect your product to customers — and why promotion and distribution must be aligned.</div><span class="week-ov-asgn">Assignment 4: Product strategy section of your marketing plan (10 pts)</span></div></div>
    <div class="week-ov"><div class="week-ov-num">6</div><div class="week-ov-body"><div class="week-ov-title">Retailing, Wholesaling & Sustainable Marketing</div><div class="week-ov-desc">Understand how products reach consumers through retailers and wholesalers. Explore sustainable marketing, ESG frameworks, and purpose-driven brands. Then finalize your marketing plan — revise all prior sections and add an executive summary, budget, action items, and evaluation framework.</div><span class="week-ov-asgn">Assignment 5: Distribution strategy (10 pts) + Final: Complete marketing plan (50 pts)</span></div></div>
  </div>
</div>`
